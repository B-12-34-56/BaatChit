AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Bucket Configuration for Bundi App'

Parameters:
  S3BucketName:
    Type: String
    Description: 'Name of the S3 bucket for storing images'
    Default: 'YOUR_S3_BUCKET_NAME'
    AllowedPattern: '^[a-z0-9-]+$'
    ConstraintDescription: 'Bucket name must contain only lowercase letters, numbers, and hyphens'

Resources:
  # S3 Bucket
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false        # Allow public ACLs for presigned URLs
        IgnorePublicAcls: false       # Don't ignore public ACLs
        BlockPublicPolicy: false       # Block public bucket policies (security)
        RestrictPublicBuckets: false   # Restrict public bucket access (security)
      
      # CORS Configuration for presigned URL uploads
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000
      
      # Versioning for data protection
      VersioningConfiguration:
        Status: Enabled
      
      # Server-side encryption
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      
      # Lifecycle policy (optional - adjust based on your needs)
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      
      # Tags
      Tags:
        - Key: Purpose
          Value: 'Presigned URL Uploads'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # Bucket Policy (restrictive - only allow authorized access)
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Deny public read access
          - Sid: DenyPublicRead
            Effect: Deny
            Principal: '*'
            Action:
              - s3:GetObject
            Resource: !Sub '${S3Bucket}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          
          # Allow presigned URL uploads (handled by IAM roles)
          - Sid: AllowPresignedUploads
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub '${S3Bucket}/*'
            Condition:
              StringEquals:
                aws:SecureTransport: true

  # IAM Role for Lambda functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${S3BucketName}-lambda-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:PutObjectAcl
                Resource: !Sub '${S3Bucket}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Ref S3Bucket
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB Table for upload tracking
  UploadTrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${S3BucketName}-upload-tracking'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ContentHash
          AttributeType: S
      KeySchema:
        - AttributeName: ContentHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: 'Upload Tracking'

  # CloudWatch Log Group for Lambda functions
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${S3BucketName}-upload-handler'
      RetentionInDays: 14

Outputs:
  S3BucketName:
    Description: 'Name of the S3 bucket'
    Value: !Ref S3Bucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'
  
  S3BucketArn:
    Description: 'ARN of the S3 bucket'
    Value: !GetAtt S3Bucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketArn'
  
  LambdaExecutionRoleArn:
    Description: 'ARN of the Lambda execution role'
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaRoleArn'
  
  UploadTrackingTableName:
    Description: 'Name of the DynamoDB table for upload tracking'
    Value: !Ref UploadTrackingTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'
  
  UploadTrackingTableArn:
    Description: 'ARN of the DynamoDB table for upload tracking'
    Value: !GetAtt UploadTrackingTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn' 